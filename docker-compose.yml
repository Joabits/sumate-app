# Entorno local completo: PostgreSQL + FastAPI + Next.js
#   docker compose up -d --build
#   Frontend: http://localhost:3000   API: http://localhost:8001/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sumate
      POSTGRES_PASSWORD: sumate
      POSTGRES_DB: sumate
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Tablas de Better Auth (solo se aplican la primera vez que se crea el volumen)
      - ./client/better-auth_migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumate -d sumate"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      ENVIRONMENT: DEV
      PROJECT_NAME: Sumate API
      DATABASE_URL: postgresql://sumate:sumate@db:5432/sumate
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_JWKS_URL: http://client:3000/api/auth/jwks
      BETTER_AUTH_ENABLE_ROLES: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      PUBLIC_URL: http://localhost:8001
      UPLOADS_DIR: /app/uploads
    command: sh -c "alembic upgrade head && python scripts/seed_causes.py && python scripts/seed_demo.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      DATABASE_URL: postgresql://sumate:sumate@db:5432/sumate
      DATABASE_SSL: "false"
      BETTER_AUTH_SECRET: dev-secret-cambiar-en-produccion-1234567890
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8001/api
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  db-data:
  uploads:
