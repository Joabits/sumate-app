name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Solo despliega si el repositorio tiene las credenciales de Azure. En un
    # fork sin el secreto los pasos se saltan en vez de fallar el commit.
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Sin credenciales de Azure, no se despliega
        if: env.AZURE_CREDENTIALS == ''
        run: echo "::notice::Falta el secreto AZURE_CREDENTIALS; se omite el despliegue."

      - name: Checkout repository
        if: env.AZURE_CREDENTIALS != ''
        uses: actions/checkout@v4

      - name: Log in to Azure
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        if: env.AZURE_CREDENTIALS != ''
        run: az acr login --name acrsumateapp

      - name: Build and Push Docker Image
        if: env.AZURE_CREDENTIALS != ''
        run: |
          cd server
          IMAGE_TAG="acrsumateapp.azurecr.io/sumate-backend:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Update Container App to new image
        if: env.AZURE_CREDENTIALS != ''
        run: |
          IMAGE_TAG="acrsumateapp.azurecr.io/sumate-backend:${{ github.sha }}"
          az containerapp update \
            --name ca-sumate-backend \
            --resource-group in_rainbows \
            --image $IMAGE_TAG
